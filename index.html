<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111923">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crossy Pets 3D</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111923}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#9ed7ff}
  .hud{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}
  .panel,.btn{background:rgba(10,15,22,.78);color:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.22);backdrop-filter:blur(8px)}
  .panel{padding:9px 13px;min-width:105px}
  .score{font-size:clamp(20px,5vw,30px);font-weight:900;line-height:1}
  .best{font-size:12px;opacity:.75;margin-top:5px}
  .top{display:flex;gap:8px;pointer-events:auto}
  .btn{border:0;width:48px;height:48px;font-size:22px;cursor:pointer}
  .chars{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right));top:max(70px,calc(env(safe-area-inset-top) + 70px));display:flex;gap:8px}
  .char{border:0;border-radius:14px;background:rgba(10,15,22,.78);font-size:25px;padding:8px 11px;cursor:pointer}
  .char.active{outline:3px solid #ffd84d}
  .controls{position:fixed;z-index:6;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;grid-template-columns:62px 62px 62px;grid-template-rows:54px 54px;gap:7px}
  .move{border:0;border-radius:14px;background:rgba(10,15,22,.8);color:#fff;font-size:26px;font-weight:900}
  .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  .overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.58);padding:20px}
  .card{width:min(92vw,360px);background:#fff;border-radius:20px;text-align:center;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .card h1{margin:0 0 8px}.card p{margin:0 0 18px;color:#555}
  .primary{border:0;border-radius:14px;background:#52bf45;color:#fff;font-size:18px;font-weight:800;padding:13px 22px}
  .hint{position:fixed;z-index:4;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,15,22,.6);color:#fff;border-radius:12px;padding:7px 11px;font-size:12px;white-space:nowrap;pointer-events:none}
  @media (pointer:coarse),(max-width:820px){.controls{display:grid}.hint{display:none}}
  @media (max-height:560px) and (orientation:landscape){.controls{left:auto;right:max(12px,env(safe-area-inset-right));transform:none}.chars{top:max(10px,env(safe-area-inset-top));right:175px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="panel"><div class="score" id="score">🏆 0</div><div class="best" id="best">Рекорд: 0</div></div>
  <div class="top"><button class="btn" id="restart">↻</button></div>
</div>
<div class="chars">
  <button class="char active" id="frog">🐸</button>
  <button class="char" id="cat">🐱</button>
</div>
<div class="controls">
  <button class="move up" data-m="up">↑</button>
  <button class="move left" data-m="left">←</button>
  <button class="move down" data-m="down">↓</button>
  <button class="move right" data-m="right">→</button>
</div>
<div class="hint">Клик / ↑ / Space — вперед · ← → — в стороны</div>
<div class="overlay" id="over">
  <div class="card">
    <h1>Попался!</h1>
    <p id="result">Счёт: 0</p>
    <button class="primary" id="again">Играть ещё</button>
  </div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const over=document.getElementById("over");
const result=document.getElementById("result");
const frogBtn=document.getElementById("frog");
const catBtn=document.getElementById("cat");

let DPR=1,W=0,H=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.6);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize,{passive:true}); resize();

const COLS=7;
const LANE=1;
const VIEW_LANES=13;
let char=localStorage.getItem("crossy3dChar")||"frog";
let best=Number(localStorage.getItem("crossy3dBest")||0);
let player,highest,dead,startTime,lastTime,riding=null;

function seeded(n){
  const x=Math.sin(n*12.9898+78.233)*43758.5453;
  return x-Math.floor(x);
}
function laneType(y){
  if(y<=1)return "grass";
  const r=seeded(y);
  if(r<.48)return "road";
  if(r<.71)return "water";
  return "grass";
}
function dir(y){return y%2===0?1:-1}
function speed(y){
  const mobile=matchMedia("(pointer:coarse)").matches;
  return (mobile?0.72:1)*(0.78+(y%5)*.085)*dir(y);
}

function reset(){
  player={x:0,y:0,jumpT:1,fromX:0,fromY:0,toX:0,toY:0};
  highest=0; dead=false; riding=null; startTime=performance.now()/1000; lastTime=startTime;
  over.style.display="none";
}
reset();

function setChar(v){
  char=v; localStorage.setItem("crossy3dChar",v);
  frogBtn.classList.toggle("active",v==="frog");
  catBtn.classList.toggle("active",v==="cat");
}
frogBtn.onclick=()=>setChar("frog"); catBtn.onclick=()=>setChar("cat"); setChar(char);
document.getElementById("restart").onclick=reset;
document.getElementById("again").onclick=reset;

function roadCars(y,t){
  const arr=[], count=1+(y%2), gap=5.2;
  for(let i=0;i<count;i++){
    let x=((i*gap+t*speed(y)*1.55+y*.87+20)%10+10)%10-5;
    arr.push({x,w:1.32});
  }
  return arr;
}
function logs(y,t){
  const arr=[], count=2+(y%2), gap=4.3;
  for(let i=0;i<count;i++){
    let x=((i*gap+t*speed(y)*.72+y*.63+20)%11+11)%11-5.5;
    arr.push({id:y+"-"+i,x,w:2.55,v:speed(y)*.72});
  }
  return arr;
}

function worldToScreen(x,y,z=0){
  const bottom=Math.max(0,player.y-3.15);
  const rel=y-bottom;
  const horizon=H*.13;
  const usable=H*.82;
  const py=H-(rel/VIEW_LANES)*usable-H*.08;
  const scale=.62+(rel/VIEW_LANES)*.5;
  const px=W/2+x*Math.min(W*.105,78)*scale;
  return {x:px,y:py-z*34*scale,s:scale};
}
function poly(points,fill,stroke=null){
  ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function box(x,y,w,d,h,top,front,side){
  const a=worldToScreen(x-w/2,y-d/2,0),b=worldToScreen(x+w/2,y-d/2,0);
  const c=worldToScreen(x+w/2,y+d/2,0),dd=worldToScreen(x-w/2,y+d/2,0);
  const ah=worldToScreen(x-w/2,y-d/2,h),bh=worldToScreen(x+w/2,y-d/2,h);
  const ch=worldToScreen(x+w/2,y+d/2,h),dh=worldToScreen(x-w/2,y+d/2,h);
  poly([dd,c,ch,dh],front);
  poly([c,b,bh,ch],side);
  poly([dh,ch,bh,ah],top);
}
function laneQuad(y,color){
  const x1=-5.6,x2=5.6;
  const a=worldToScreen(x1,y-.5),b=worldToScreen(x2,y-.5),c=worldToScreen(x2,y+.5),d=worldToScreen(x1,y+.5);
  poly([a,b,c,d],color);
}

function tree(x,y){
  box(x,y,.35,.35,.55,"#8b5a2b","#6d431f","#5a371b");
  box(x,y,.95,.85,.85,"#62b94d","#4f9d3e","#3f8432");
}
function drawGrass(y){
  laneQuad(y,y%2?"#77c75c":"#86d66a");
  const r=seeded(y*7.1);
  if(r>.45){tree(-4.4+seeded(y*3)*1.2,y+.08); if(r>.72)tree(4.2-seeded(y*5),y-.02)}
}
function drawRoad(y,t){
  laneQuad(y,"#4d5259");
  const left=worldToScreen(-5.4,y),right=worldToScreen(5.4,y);
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;ctx.setLineDash([12,14]);
  ctx.beginPath();ctx.moveTo(left.x,left.y);ctx.lineTo(right.x,right.y);ctx.stroke();ctx.setLineDash([]);
  for(const c of roadCars(y,t)){
    const red=(y+Math.round(c.x*3))%2===0;
    box(c.x,y,c.w,.62,.56,red?"#ff795e":"#ffd35f",red?"#db5c46":"#e6ad3c",red?"#bd4938":"#c79430");
    box(c.x-.15*dir(y),y-.01,.54,.48,.34,"#bfe8ff","#9fc8dd","#83adbf");
  }
}
function drawWater(y,t){
  laneQuad(y,"#43a9dc");
  const a=worldToScreen(-5,y),b=worldToScreen(5,y);
  ctx.strokeStyle="rgba(255,255,255,.24)";ctx.lineWidth=1.4;
  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(a.x,b.y+k*7);ctx.lineTo(b.x,b.y+k*7);ctx.stroke()}
  for(const l of logs(y,t)){
    box(l.x,y,l.w,.52,.27,"#a86732","#865025","#6d401f");
    const p=worldToScreen(l.x-l.w*.36,y+.02,.29);
    ctx.fillStyle="#c98947";ctx.beginPath();ctx.ellipse(p.x,p.y,6*p.s,3*p.s,0,0,Math.PI*2);ctx.fill();
  }
}

function drawCharacter(x,y,jump){
  const p=worldToScreen(x,y,.22+jump*.38),s=p.s;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8;ctx.shadowOffsetY=5;
  if(char==="frog"){
    ctx.fillStyle="#64b844";ctx.beginPath();ctx.ellipse(0,0,19*s,23*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#78ca55";ctx.beginPath();ctx.arc(0,-20*s,17*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";
    for(const ex of [-8,8]){ctx.beginPath();ctx.arc(ex*s,-31*s,6*s,0,Math.PI*2);ctx.fill();ctx.fillStyle="#1f2b20";ctx.beginPath();ctx.arc(ex*s,-31*s,2.5*s,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff"}
  }else{
    ctx.fillStyle="#ed993c";ctx.beginPath();ctx.ellipse(0,1*s,18*s,24*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f1a648";ctx.beginPath();ctx.arc(0,-20*s,17*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-14*s,-30*s);ctx.lineTo(-8*s,-44*s);ctx.lineTo(-2*s,-31*s);ctx.fill();
    ctx.beginPath();ctx.moveTo(14*s,-30*s);ctx.lineTo(8*s,-44*s);ctx.lineTo(2*s,-31*s);ctx.fill();
    ctx.fillStyle="#222";for(const ex of [-6,6]){ctx.beginPath();ctx.arc(ex*s,-21*s,2.2*s,0,Math.PI*2);ctx.fill()}
  }
  ctx.restore();
}

function lose(){
  if(dead)return; dead=true;riding=null;
  best=Math.max(best,highest);localStorage.setItem("crossy3dBest",best);
  result.textContent="Счёт: "+highest; over.style.display="flex";
}
function move(dx,dy){
  if(dead||player.jumpT<1)return;
  const nx=Math.max(-3,Math.min(3,player.x+dx));
  const ny=Math.max(0,player.y+dy);
  player.fromX=player.x;player.fromY=player.y;player.toX=nx;player.toY=ny;player.jumpT=0;riding=null;
}
function checkLanding(t){
  const type=laneType(Math.round(player.y));
  if(type==="water"){
    const ls=logs(Math.round(player.y),t);
    let hit=null;
    for(const l of ls)if(Math.abs(player.x-l.x)<l.w*.48){hit=l;break}
    if(hit)riding={lane:Math.round(player.y),id:hit.id}; else lose();
  }
}
function update(dt,t){
  if(dead)return;
  if(player.jumpT<1){
    player.jumpT=Math.min(1,player.jumpT+dt*5.5);
    const q=1-Math.pow(1-player.jumpT,3);
    player.x=player.fromX+(player.toX-player.fromX)*q;
    player.y=player.fromY+(player.toY-player.fromY)*q;
    if(player.jumpT===1){player.x=player.toX;player.y=player.toY;highest=Math.max(highest,Math.round(player.y));checkLanding(t)}
  } else if(riding){
    const ls=logs(riding.lane,t), l=ls.find(v=>v.id===riding.id);
    if(l){
      player.x=l.x;
      if(player.x<-3.6||player.x>3.6)lose();
    } else lose();
  }

  const lane=Math.round(player.y),type=laneType(lane);
  if(type==="road"&&player.jumpT===1){
    for(const c of roadCars(lane,t))if(Math.abs(player.x-c.x)<(c.w*.52+.28))lose();
  }
}
function draw(t){
  ctx.fillStyle="#9ed7ff";ctx.fillRect(0,0,W,H);
  const bottom=Math.max(0,Math.floor(player.y-3));
  for(let y=bottom+VIEW_LANES;y>=bottom;y--){
    const type=laneType(y);
    if(type==="grass")drawGrass(y); else if(type==="road")drawRoad(y,t); else drawWater(y,t);
  }
  const jump=player.jumpT<1?Math.sin(player.jumpT*Math.PI):0;
  drawCharacter(player.x,player.y,jump);
  scoreEl.textContent="🏆 "+highest;bestEl.textContent="Рекорд: "+Math.max(best,highest);
}
function loop(ms){
  const t=ms/1000,dt=Math.min(.033,t-lastTime);lastTime=t;
  update(dt,t);draw(t);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(e.key==="ArrowUp"||e.key===" "||e.key.toLowerCase()==="w")move(0,1);
  else if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")move(0,-1);
  else if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1,0);
  else if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1,0);
},{passive:false});

document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("pointerdown",e=>{
  e.preventDefault();const m=b.dataset.m;
  if(m==="up")move(0,1);if(m==="down")move(0,-1);if(m==="left")move(-1,0);if(m==="right")move(1,0);
}));

let sx=0,sy=0,st=0;
canvas.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;st=performance.now();},{passive:true});
canvas.addEventListener("pointerup",e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy,d=Math.hypot(dx,dy);
  if(d<24){move(0,1);return}
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0); else move(0,dy<0?1:-1);
},{passive:true});

})();
</script>
</body>
</html>
