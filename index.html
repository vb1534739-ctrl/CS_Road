<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151821" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Crossy Pets — Котик и Лягушка</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      min-height: 100dvh;
      background: #151821;
      color: #fff;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .game-shell {
      width: min(94vw, 620px);
      height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 8px;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); line-height: 1.1; }
    .hint {
      margin: 0;
      opacity: .8;
      font-size: 13px;
      line-height: 1.25;
    }
    .desktop-hint { display: inline; }
    .mobile-hint { display: none; }
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 9px 13px;
      font-size: 15px;
      cursor: pointer;
      background: #fff;
      color: #151821;
      font-weight: 700;
      touch-action: manipulation;
    }
    button:active { transform: scale(.97); }
    button.active { outline: 3px solid #ffd54a; }
    .canvas-wrap {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 5 / 7;
      background: #8bd36c;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      touch-action: none;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 700;
      font-size: 15px;
    }
    .mobile-controls {
      display: none;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 54px 54px;
      gap: 6px;
      justify-content: center;
    }
    .move-btn {
      min-height: 0;
      padding: 0;
      font-size: 25px;
      border-radius: 14px;
      background: rgba(255,255,255,.94);
    }
    .move-up { grid-column: 2; grid-row: 1; }
    .move-left { grid-column: 1; grid-row: 2; }
    .move-down { grid-column: 2; grid-row: 2; }
    .move-right { grid-column: 3; grid-row: 2; }

    @media (max-width: 700px), (pointer: coarse) {
      .game-shell {
        width: 100%;
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
        grid-template-rows: auto auto 1fr auto auto;
        gap: 6px;
      }
      .desktop-hint { display: none; }
      .mobile-hint { display: inline; }
      .toolbar { gap: 6px; }
      .toolbar button { min-height: 38px; padding: 7px 10px; font-size: 14px; }
      canvas { border-radius: 14px; }
      .mobile-controls { display: grid; }
      .stats { font-size: 14px; }
    }

    @media (max-height: 700px) and (pointer: coarse) {
      h1 { display: none; }
      .hint { display: none; }
      .mobile-controls {
        grid-template-columns: 52px 52px 52px;
        grid-template-rows: 44px 44px;
      }
      .move-btn { font-size: 21px; }
      .toolbar button { min-height: 34px; padding: 5px 9px; }
    }

    @media (orientation: landscape) and (pointer: coarse) {
      .game-shell {
        width: min(96vw, 760px);
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto 1fr auto;
      }
      h1, .hint, .toolbar, .stats { grid-column: 1; }
      .canvas-wrap { grid-column: 1; grid-row: 3; }
      .mobile-controls {
        grid-column: 2;
        grid-row: 1 / 5;
        align-self: center;
        padding-left: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1>Crossy Pets</h1>
    <p class="hint">
      <span class="desktop-hint">Клик / пробел / ↑ — вперед. ← → — в стороны. ↓ — назад.</span>
      <span class="mobile-hint">Тап — вперед. Свайп — в нужную сторону.</span>
    </p>

    <div class="toolbar">
      <button id="catBtn">🐱 Котик</button>
      <button id="frogBtn">🐸 Лягушка</button>
      <button id="restartBtn">Заново</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="500" height="700"></canvas>
    </div>

    <div class="stats">
      <span id="score">Счёт: 0</span>
      <span id="best">Рекорд: 0</span>
    </div>

    <div class="mobile-controls" aria-label="Управление">
      <button class="move-btn move-up" data-dx="0" data-dy="1" aria-label="Вверх">▲</button>
      <button class="move-btn move-left" data-dx="-1" data-dy="0" aria-label="Влево">◀</button>
      <button class="move-btn move-down" data-dx="0" data-dy="-1" aria-label="Вниз">▼</button>
      <button class="move-btn move-right" data-dx="1" data-dy="0" aria-label="Вправо">▶</button>
    </div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 5;
const ROWS_VISIBLE = 11;
const CELL_W = canvas.width / COLS;
const CELL_H = canvas.height / ROWS_VISIBLE;

let character = localStorage.getItem("crossyCharacter") || "cat";
let player = { x: 2, y: 0 };
let highestY = 0;
let gameOver = false;
let startedAt = performance.now();
let lastMoveAt = 0;
let best = Number(localStorage.getItem("crossyBest") || 0);

const catBtn = document.getElementById("catBtn");
const frogBtn = document.getElementById("frogBtn");
const restartBtn = document.getElementById("restartBtn");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

function setCharacter(name) {
  character = name;
  localStorage.setItem("crossyCharacter", name);
  catBtn.classList.toggle("active", name === "cat");
  frogBtn.classList.toggle("active", name === "frog");
}
catBtn.onclick = () => setCharacter("cat");
frogBtn.onclick = () => setCharacter("frog");
restartBtn.onclick = restart;
setCharacter(character);

function restart() {
  player = { x: 2, y: 0 };
  highestY = 0;
  gameOver = false;
  startedAt = performance.now();
}

function rowType(worldY) {
  if (worldY <= 1) return "grass";
  const n = Math.abs(Math.sin(worldY * 12.9898) * 43758.5453) % 1;
  if (n < 0.57) return "road";
  if (n < 0.72) return "water";
  return "grass";
}

function rowSpeed(worldY) {
  const base = 65 + (worldY % 7) * 11;
  return worldY % 2 === 0 ? base : -base;
}

function carCount(worldY) {
  return 1 + (worldY % 2);
}

function carPositions(worldY, now) {
  const speed = rowSpeed(worldY);
  const laneWidth = canvas.width + 220;
  const t = (now - startedAt) / 1000;
  const positions = [];
  const count = carCount(worldY);
  const spacing = laneWidth / count;

  for (let i = 0; i < count; i++) {
    let x = (i * spacing + t * speed + worldY * 37) % laneWidth;
    if (x < 0) x += laneWidth;
    x -= 110;
    positions.push(x);
  }
  return positions;
}

function logPositions(worldY, now) {
  const speed = rowSpeed(worldY) * 0.55;
  const laneWidth = canvas.width + 260;
  const t = (now - startedAt) / 1000;
  const positions = [];
  const count = 2 + (worldY % 2);
  const spacing = laneWidth / count;

  for (let i = 0; i < count; i++) {
    let x = (i * spacing + t * speed + worldY * 53) % laneWidth;
    if (x < 0) x += laneWidth;
    x -= 130;
    positions.push(x);
  }
  return positions;
}

function visibleBottomY() {
  return Math.max(0, player.y - 3);
}

function screenYForWorld(worldY) {
  const bottom = visibleBottomY();
  const rowFromBottom = worldY - bottom;
  return canvas.height - (rowFromBottom + 1) * CELL_H;
}

function drawBackground(now) {
  const bottom = visibleBottomY();

  for (let i = 0; i < ROWS_VISIBLE + 1; i++) {
    const worldY = bottom + i;
    const sy = screenYForWorld(worldY);
    const type = rowType(worldY);

    if (type === "road") {
      ctx.fillStyle = "#4d515a";
      ctx.fillRect(0, sy, canvas.width, CELL_H);
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 16]);
      ctx.beginPath();
      ctx.moveTo(0, sy + CELL_H / 2);
      ctx.lineTo(canvas.width, sy + CELL_H / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      drawCars(worldY, sy, now);
    } else if (type === "water") {
      ctx.fillStyle = "#4aa4dc";
      ctx.fillRect(0, sy, canvas.width, CELL_H);
      drawLogs(worldY, sy, now);
    } else {
      ctx.fillStyle = worldY % 2 ? "#86d66b" : "#75c95b";
      ctx.fillRect(0, sy, canvas.width, CELL_H);
      ctx.fillStyle = "rgba(35,100,35,.18)";
      for (let j = 0; j < 4; j++) {
        const x = ((worldY * 67 + j * 139) % canvas.width);
        ctx.beginPath();
        ctx.arc(x, sy + 18 + (j % 2) * 24, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawCars(worldY, sy, now) {
  const xs = carPositions(worldY, now);
  const directionRight = rowSpeed(worldY) > 0;
  xs.forEach((x, i) => {
    ctx.fillStyle = i % 2 ? "#ff6b6b" : "#ffd166";
    ctx.fillRect(x, sy + 15, 82, CELL_H - 30);
    ctx.fillStyle = "#20242d";
    ctx.fillRect(x + 12, sy + 9, 18, 10);
    ctx.fillRect(x + 52, sy + 9, 18, 10);
    ctx.fillRect(x + 12, sy + CELL_H - 19, 18, 10);
    ctx.fillRect(x + 52, sy + CELL_H - 19, 18, 10);
    ctx.fillStyle = "#c8efff";
    const windshieldX = directionRight ? x + 53 : x + 10;
    ctx.fillRect(windshieldX, sy + 23, 19, CELL_H - 46);
  });
}

function drawLogs(worldY, sy, now) {
  const xs = logPositions(worldY, now);
  xs.forEach((x) => {
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(x, sy + 18, 118, CELL_H - 36);
    ctx.fillStyle = "#b9773a";
    ctx.beginPath();
    ctx.arc(x + 14, sy + CELL_H / 2, 10, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawPlayer() {
  const sy = screenYForWorld(player.y);
  const cx = player.x * CELL_W + CELL_W / 2;
  const cy = sy + CELL_H / 2;
  ctx.font = "48px Apple Color Emoji, Segoe UI Emoji, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(character === "cat" ? "🐱" : "🐸", cx, cy);
}

function playerRect() {
  const sy = screenYForWorld(player.y);
  return {
    x: player.x * CELL_W + 22,
    y: sy + 16,
    w: CELL_W - 44,
    h: CELL_H - 32
  };
}

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function checkCollision(now) {
  if (gameOver) return;
  const type = rowType(player.y);
  const p = playerRect();
  const sy = screenYForWorld(player.y);

  if (type === "road") {
    for (const x of carPositions(player.y, now)) {
      const car = { x, y: sy + 15, w: 82, h: CELL_H - 30 };
      if (overlaps(p, car)) return lose();
    }
  }

  if (type === "water") {
    let safe = false;
    for (const x of logPositions(player.y, now)) {
      const log = { x, y: sy + 18, w: 118, h: CELL_H - 36 };
      if (overlaps(p, log)) {
        safe = true;
        break;
      }
    }
    if (!safe) return lose();
  }
}

function lose() {
  gameOver = true;
  best = Math.max(best, highestY);
  localStorage.setItem("crossyBest", best);
  if (navigator.vibrate) navigator.vibrate(80);
}

function move(dx, dy) {
  if (gameOver) return;
  const now = performance.now();
  if (now - lastMoveAt < 70) return;
  lastMoveAt = now;

  player.x = Math.max(0, Math.min(COLS - 1, player.x + dx));
  player.y = Math.max(0, player.y + dy);
  highestY = Math.max(highestY, player.y);
}

window.addEventListener("keydown", (e) => {
  const key = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(key)) e.preventDefault();
  if (key === "ArrowUp" || key === " " || key.toLowerCase() === "w") move(0, 1);
  if (key === "ArrowDown" || key.toLowerCase() === "s") move(0, -1);
  if (key === "ArrowLeft" || key.toLowerCase() === "a") move(-1, 0);
  if (key === "ArrowRight" || key.toLowerCase() === "d") move(1, 0);
  if (key.toLowerCase() === "r") restart();
}, { passive: false });

// Мобильное управление: короткий тап = вперед, свайп = направление.
let pointerStart = null;
canvas.addEventListener("pointerdown", (e) => {
  pointerStart = { x: e.clientX, y: e.clientY, time: performance.now() };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointerup", (e) => {
  if (!pointerStart) return;
  const dx = e.clientX - pointerStart.x;
  const dy = e.clientY - pointerStart.y;
  const distance = Math.hypot(dx, dy);
  const swipeThreshold = 24;

  if (distance < swipeThreshold) {
    move(0, 1);
  } else if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 1 : -1, 0);
  } else {
    move(0, dy < 0 ? 1 : -1);
  }
  pointerStart = null;
});
canvas.addEventListener("pointercancel", () => { pointerStart = null; });

// Большие экранные кнопки — запасной вариант управления на телефоне.
document.querySelectorAll(".move-btn").forEach((btn) => {
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    move(Number(btn.dataset.dx), Number(btn.dataset.dy));
  });
});

// Не даём iOS приблизить страницу двойным тапом.
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });

function drawGameOver() {
  if (!gameOver) return;
  ctx.fillStyle = "rgba(0,0,0,.62)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 42px Arial";
  ctx.fillText("Столкновение!", canvas.width / 2, canvas.height / 2 - 45);
  ctx.font = "22px Arial";
  ctx.fillText(`Счёт: ${highestY}`, canvas.width / 2, canvas.height / 2 + 5);
  ctx.font = "18px Arial";
  ctx.fillText("Нажми «Заново»", canvas.width / 2, canvas.height / 2 + 50);
}

function loop(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground(now);
  drawPlayer();
  checkCollision(now);
  drawGameOver();
  scoreEl.textContent = `Счёт: ${highestY}`;
  bestEl.textContent = `Рекорд: ${Math.max(best, highestY)}`;
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
